image: busybox

.node:
    image:
        name: node:23
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - .npm/
    before_script:
        - node --version
        - CYPRESS_INSTALL_BINARY=0 npm ci --cache .npm --prefer-offline
    tags:
        - k8s

build:
    stage: build
    needs: [ ]
    extends: .node
    script:
        - npm run build
    artifacts:
        paths:
            - dist/

cypress:
    stage: test
    needs:
        - build
    image: cypress/included:13.14.2
    artifacts:
        when: on_failure
        paths:
            - cypress/screenshots/
            - cypress/videos/
    script:
        - npm run cy:run



pages:
    stage: deploy
    script:
        - echo "The site will be deployed to $CI_PAGES_URL"
        - mkdir public
        - cp -R data textures index.html loading.gif pngfix.js prototype.js standard.css tools.js zero_craft.js public
    artifacts:
        paths:
            - public
    rules:
        #    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
        -   if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
