image: busybox

.node:
    image:
        name: node:23
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - .npm/
    before_script:
        - node --version
        - CYPRESS_INSTALL_BINARY=0 npm ci --cache .npm --prefer-offline

build:
    stage: build
    needs: [ ]
    extends: .node
    script:
        - npm run build
    artifacts:
        paths:
            - build/

cypress:
    stage: test
    needs:
        - build
    extends: .node
    image:
        name: cypress/included:14.5.4
        entrypoint: [ "" ]
    artifacts:
        expire_in: 1 day
        when: on_failure
        paths:
            - cypress/screenshots/
            - cypress/videos/
    script:
        - npm run ci:cypress



pages:
    stage: deploy
    needs:
        - build
        - cypress
    script:
        - echo "The site will be deployed to $CI_PAGES_URL"
        - cp -R build/client/zero.craft/* public/
    artifacts:
        paths:
            - build
    rules:
        #    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
        -   if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
