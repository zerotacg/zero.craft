image: busybox

pages:
  stage: deploy
  script:
    - echo "The site will be deployed to $CI_PAGES_URL"
    - mkdir public
    - cp -R data textures index.html loading.gif pngfix.js prototype.js standard.css tools.js zero_craft.js public
  artifacts:
    paths:
      - public
  rules:
#    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
