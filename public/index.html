<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <meta
        name="description"
        content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png"/>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Craft Simulator</title>
    <link type="image/x-icon" rel="shortcut icon" href="./favicon.ico">
    <link type="text/css" rel="stylesheet" href="./standard.css">
    <link type="text/css" rel="stylesheet" href="./textures/texture.css">
    <link type="text/css" rel="stylesheet" href="./textures/texture_interfaces_dxtc.css">
    <link type="text/css" rel="stylesheet" href="./textures/texture_interfaces_v3.css">
    <link type="text/css" rel="stylesheet" href="./textures/texture_interfaces_v3_login.css">
    <link type="text/css" rel="stylesheet" href="./textures/texture_interfaces_v3_outgame_ui.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script type="text/javascript" src="./prototype.js"></script>
    <script type="text/javascript" src="./tools.js"></script>
    <script type="text/javascript" src="./data/translation.js"></script>
    <script type="text/javascript" src="./data/item_words.js"></script>
    <script type="text/javascript" src="./data/slots.js"></script>
    <script type="text/javascript" src="./data/sheets.js"></script>
    <script type="text/javascript" src="./data/materials.js"></script>
    <script type="text/javascript" src="./zero_craft.js"></script>
</head>
<body role="document">
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>

<div id="ui:interface:main"
     style="top: 0px;
                width: 90%;
                margin: 0% auto;">


    <div id="ui:interface:main:slots"
         style="top: 0px;
                  float: left;
                  width: 18%;
                  margin: 3px;
                  border: 1px;
                  border-style: solid;
                  padding-top: 1%;
                  padding-bottom: 1%;
                  padding-left: 1%;
                  padding-right: 0;">
        <div class="text">uiSlotsTitle</div>
    </div>


    <div id="ui:interface:main:craft_window"
         style="top: 0px;
                  float: left;
                  width: 78%;
                  margin: 3px;
                  border: 1px;
                  border-style: solid;
                  padding-top: 1%;
                  padding-bottom: 1%;
                  padding-left: 1%;
                  padding-right: 0;">
        <div class="text" style="display: block;">uiCraftWindowTitle</div>
        <div id="ui:interface:main:craft_window:item_list"
             style="top: 0px;
                    float: left;
                    width: 48%;
                    margin: 3px;
                    border: 1px;
                    border-style: solid;
                    padding-bottom: 2%;">
            <div class="text">uiItemListTitle</div>
        </div>


        <div id="ui:interface:main:craft_window:preview"
             style="top: 0px;
                    float: left;
                    width: 48%;
                    margin: 3px;
                    border: 1px solid;
                    padding-bottom: 2%;">
            <div class="text">uiPreviewTitle</div>
        </div>
    </div>
</div>


<div id="ui:interface:material_selection"
     style="top: 0px;
                position: absolute;
                display: none;
                min-width: 10px;
                min-height: 10px;
                border: 1px solid;
                background-color: #333333;"></div>


<div id="ui:interface:quantity_selection"
     style="width: 187px;
                height: 105px;
                top: 0px;
                z-index: 1;
                position: absolute;
                display: none;
                border: 1px solid;
                background-color: #333333;">
    <div class="text">uiSelectQuantity</div>
    <div id="ui:interface:quantity_selection:sheet"
         style="position: absolute;
                  left: 43px;
                  top: 30px"></div>

    <input id="ui:interface:quantity_selection:txt_quantity"
           type="text"
           maxlength="3"
           size="2"
           style="position: absolute;
                    left: 103px;
                    top: 40px"/>

    <input id="ui:interface:quantity_selection:button_remove"
           type="button"
           value="remove"
           style="position: absolute;
                    left: 3px;
                    top: 80px"/>

    <input id="ui:interface:quantity_selection:button_ok"
           type="button"
           value="ok"
           style="position: absolute;
                    left: 83px;
                    top: 80px"/>

    <input id="ui:interface:quantity_selection:button_cancel"
           type="button"
           value="cancel"
           style="position: absolute;
                    left: 123px;
                    top: 80px"
           onclick="ah_hide('ui:interface:quantity_selection')"/>
</div>


<script type="text/javascript">
    try {
        startZeroCraft();
    } catch (e) {
    }
</script>
</body>
</html>
